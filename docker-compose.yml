# docker-compose.yml

services:
  # 1. Infrastructure: Redis Cache Service (Uses Alpine - Minimal, No Git)
  redis:
    image: redis:7-alpine
    container_name: codespace_redis
    command: redis-server --appendonly yes
    ports: 
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - assessment-net

  # 2. Infrastructure: RabbitMQ Message Broker Service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: codespace_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - assessment-net

  # 3. Infrastructure: MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: codespace_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - assessment-net

  # 4. Backend Service: Assessment API
  assessment-api:
    build:
      context: .
      dockerfile: assessment-api/Dockerfile
    container_name: codespace_assessment_api
    command: npm run dev
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./assessment-api:/usr/src/app
      - ./contracts:/usr/src/contracts:ro
      - ./judge-service-go:/usr/src/app/judge-service-go:ro
      - /usr/src/app/node_modules
    environment:
      - MONGO_URI=${DB_CONNECTION_STRING:-mongodb://mongo:27017/assessment_db}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-assessment_db}
      - PORT=3000
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - RABBITMQ_URI=${RABBITMQ_URI:-amqp://user:password@rabbitmq:5672}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_me}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    networks:
      - assessment-net

  # Scopes judge-service-go's Docker access to only the endpoints it actually
  # calls (container create/start/stop/remove/inspect/update, exec, image
  # inspect/pull) instead of the raw docker.sock, which is full unscoped admin
  # access to the host's Docker daemon. See docs/CODESPACE_HANDOFF.md item #9.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: codespace_docker_socket_proxy
    environment:
      - LOG_LEVEL=info
      - CONTAINERS=1
      - POST=1
      - DELETE=1
      - EXEC=1
      - IMAGES=1
      # Everything else (NETWORKS, VOLUMES, BUILD, SWARM, SERVICES, NODES,
      # PLUGINS, SECRETS, CONFIGS, SYSTEM, etc.) stays at its default of 0 —
      # judge-service-go never calls those endpoints.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - assessment-net
    restart: unless-stopped

  judge-service-go:
    build:
      context: ./judge-service-go
      dockerfile: Dockerfile
      # Dev stage keeps the Go toolchain and declares no ENTRYPOINT, so the image CMD
      # rebuilds from the bind-mounted source on each start. Without this target the
      # runtime stage is built, whose exec-form ENTRYPOINT swallowed the `command:`
      # that used to live here as mere arguments - the container then served the
      # image-baked binary and silently ignored every local edit. See the dev stage
      # comment in judge-service-go/Dockerfile and docs/LOCAL_TESTING_NOTES.md 5b.
      target: dev
    container_name: codespace_judge_service_go
    # The judge exits when it loses RabbitMQ and relies on this to come back (as in prod).
    restart: unless-stopped
    working_dir: /src
    volumes:
      - ./judge-service-go:/src
      # Persist the Go build cache so a restart recompiles incrementally instead of
      # rebuilding every package from scratch.
      - judge_go_build_cache:/root/.cache/go-build
      - /tmp:/tmp
    environment:
      - MONGO_URI=${DB_CONNECTION_STRING:-mongodb://mongo:27017/assessment_db}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-assessment_db}
      - RABBITMQ_URL=${RABBITMQ_URI:-amqp://user:password@rabbitmq:5672}
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - LOG_LEVEL=info
      - DEFAULT_POOL_SIZE=4
      - JUDGE_CENTRAL_COMPARE_PY=true
      - JUDGE_CENTRAL_COMPARE_JS=true
      - JUDGE_CENTRAL_COMPARE_JAVA=true
      - JUDGE_CENTRAL_COMPARE_CPP=true
      - JUDGE_CENTRAL_COMPARE_C=true
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    networks:
      - assessment-net

  judge-java:
    build:
      context: ./judge-service-go/environments/java
      dockerfile: Dockerfile
    image: judge-java-env
    pull_policy: build
    container_name: judge_java_env
    networks:
      - assessment-net

  judge-js:
    build:
      context: ./judge-service-go/environments/javascript
      dockerfile: Dockerfile
    image: judge-js-env
    pull_policy: build
    container_name: judge_js_env
    networks:
      - assessment-net

  judge-py:
    build:
      context: ./judge-service-go/environments/python
      dockerfile: Dockerfile
    image: judge-py-env
    pull_policy: build
    container_name: judge_py_env
    networks:
      - assessment-net

  judge-c:
    build:
      context: ./judge-service-go/environments/c
      dockerfile: Dockerfile
    image: judge-c-env
    pull_policy: build
    container_name: judge_c_env
    networks:
      - assessment-net

  judge-cpp:
    build:
      context: ./judge-service-go/environments/cpp
      dockerfile: Dockerfile
    image: judge-cpp-env
    pull_policy: build
    container_name: judge_cpp_env
    networks:
      - assessment-net

  judge-csharp:
    build:
      context: ./judge-service-go/environments/csharp
      dockerfile: Dockerfile
    image: judge-csharp-env
    pull_policy: build
    container_name: judge_csharp_env
    networks:
      - assessment-net

  judge-go:
    build:
      context: ./judge-service-go/environments/go
      dockerfile: Dockerfile
    image: judge-go-env
    pull_policy: build
    container_name: judge_go_env
    networks:
      - assessment-net

  judge-rust:
    build:
      context: ./judge-service-go/environments/rust
      dockerfile: Dockerfile
    image: judge-rust-env
    pull_policy: build
    container_name: judge_rust_env
    networks:
      - assessment-net

  judge-ruby:
    build:
      context: ./judge-service-go/environments/ruby
      dockerfile: Dockerfile
    image: judge-ruby-env
    pull_policy: build
    container_name: judge_ruby_env
    networks:
      - assessment-net

  judge-php:
    build:
      context: ./judge-service-go/environments/php
      dockerfile: Dockerfile
    image: judge-php-env
    pull_policy: build
    container_name: judge_php_env
    networks:
      - assessment-net

  judge-kotlin:
    build:
      context: ./judge-service-go/environments/kotlin
      dockerfile: Dockerfile
    image: judge-kotlin-env
    pull_policy: build
    container_name: judge_kotlin_env
    networks:
      - assessment-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codespace_frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://assessment-api:3000

    depends_on:
      - assessment-api
    networks:
      - assessment-net

  harness:
    image: node:20-alpine
    container_name: codespace_submission_harness
    working_dir: /app
    command: ["npm", "run", "test:submission"]
    volumes:
      - .:/app
    environment:
      - API_BASE_URL=http://assessment-api:3000/api
    depends_on:
      - assessment-api
    networks:
      - assessment-net

volumes:
  redis_data:
  rabbitmq_data:
  mongo_data:
  judge_go_build_cache:

networks:
  assessment-net:
