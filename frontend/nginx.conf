# Serves the built SPA and proxies the API and the interview WebSocket to assessment-api,
# so the browser only ever talks to one origin.

# Lets the WebSocket upgrade through, and keeps plain requests as normal HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bulk student/problem imports upload spreadsheets and test-case files.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://assessment-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append to the chain rather than overwrite it, so the real client address survives
        # the Cloudflare -> Traefik -> nginx hops once the API is told to trust them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Code runs can take up to ~25s with wait=true; leave headroom above that.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /ws/interview {
        proxy_pass http://assessment-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Interview rooms stay open for the length of an interview.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated, or users keep an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths go to the router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
