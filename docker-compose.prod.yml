# docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Dokploy production deployment: backend plus the frontend (nginx) service.
#
# Before deploying, set these required env vars in Dokploy:
#   RABBITMQ_PASS     strong password for RabbitMQ
#   MONGO_ROOT_PASS   strong password for MongoDB root user
#   REDIS_PASS        strong password for Redis
#   JWT_SECRET        long random secret for JWT signing
#
# Required for the Arventiq/exam-platform integration:
#   CODEASSESS_SHIM_KEY   shared secret for the GO Judge public API shim at
#                         /api/codeAssess/submissions. exam-platform sends this back as the
#                         `x-rapidapi-key` header (its judge.js is built to talk to a
#                         GO Judge-style instance) — set the SAME value as that platform's
#                         JUDGE0_API_KEY Worker secret (that var name lives on their side,
#                         unrelated to this rename).
#   TESTING_PLATFORM_KEY  shared secret for /api/integration/* (checked as `x-service-key`).
#                         No insecure fallback on purpose — deploy fails closed if unset.
#   ARVENTIQ_SECRET       shared secret for the Arventiq integration (see auth middleware).
#                         No insecure fallback on purpose — deploy fails closed if unset.
#
# Optional tuning vars (have sensible defaults):
#   MONGO_DB_NAME          (default: assessment_db)
#   ASSESSMENT_API_PORT    (default: 3000)
#   JUDGE_LOG_LEVEL        (default: info)
#   JUDGE_POOL_SIZE        (default: 2) — used as the Min (and, unless overridden below, Max)
#                          pool size for every language that has no per-language override.
#   JUDGE_MAX_EXECS        (default: 500; containers are also reset after every submission)
#
# Per-language pool sizing / autoscaling (all optional — see judge-service-go/main.go for the
# full per-language default table and pkg/pool/pool.go for the autoscaling algorithm):
#   JUDGE_POOL_MAX_JAVA / JUDGE_POOL_MAX_CPP   (default: 8) — these two were the most
#                          container-starved languages in live load testing (slow multi-stage
#                          compile + JVM/native runtime), so they get the highest headroom.
#   JUDGE_POOL_GLOBAL_CAP  (default: 60) — hard ceiling on total containers summed across ALL
#                          languages, since they all share the same host CPU. Only matters once
#                          autoscaling is on; startup refuses to boot if the sum of every
#                          language's Min already exceeds this.
#   JUDGE_POOL_AUTOSCALE_ENABLED  (default: false) — per-language pool sizes (Min only) apply
#                          regardless; this additionally lets each language's live pool grow
#                          toward its Max under sustained load and shrink back under its Min-
#                          floor when idle. Ships off — flip on deliberately once /stats's
#                          metrics.acquire_wait numbers have been observed and look sane.
#   JUDGE_WORKER_CONCURRENCY  (default: 24) — how many submissions can be pulled off RabbitMQ
#                          and processed concurrently. Deliberately set above the host's core
#                          count: these workers spend most of their time blocked on Docker API
#                          calls (compile/run), not local CPU work, so an I/O-bound pool this
#                          size keeps more of the container pool's headroom actually reachable
#                          than sizing it to cores would.
#   Every other language's JUDGE_POOL_MIN_<ABBR>/JUDGE_POOL_MAX_<ABBR> (PY, JS, TS, C, CS, GO,
#   RS, RB, PHP, KT), and the autoscaling thresholds/cooldowns
#   (JUDGE_POOL_SCALE_UP_THRESHOLD_MS, JUDGE_POOL_SCALE_DOWN_THRESHOLD_MS,
#   JUDGE_POOL_SCALE_UP_COOLDOWN, JUDGE_POOL_SCALE_DOWN_COOLDOWN, JUDGE_POOL_AUTOSCALE_INTERVAL
#   — cooldowns/interval in whole seconds) are available but not wired through this compose
#   file by default; their defaults are documented in judge-service-go/main.go's const block.
#
# Submission quota (both optional — see assessment-api's env.js / quota.service.js):
#   COLLEGE_SUBMISSION_QUOTA          (default: 30) — inter-college fairness cap on a shared
#                          judge, per 60s. NOT sized for a real exam cohort: 30/60s is the
#                          WHOLE college combined, measured too strict for ~500 students
#                          sharing one college during a live exam. Recommend 300 once judge
#                          capacity (pool autoscaling above, language mix) has been sized for
#                          that cohort — this doesn't add processing capacity, it only stops
#                          rejecting legitimate admission before the judge's own throughput
#                          ceiling (see capacity notes) becomes the real constraint.
#   STUDENT_SUBMISSION_QUOTA          (default: 10) — per-student companion, same 60s window.
#                          Caps how much of the (now larger) college-wide pool one student can
#                          consume, so a runaway auto-submit loop can't starve the rest of the
#                          cohort once COLLEGE_SUBMISSION_QUOTA is raised to something generous.
#   Both *_WINDOW_SECONDS variants (default: 60) are also available.
#
# Phase 2 billing (all optional — unset until a real Stripe account exists):
#   STRIPE_SECRET_KEY      Stripe secret key. Billing routes soft-fail with 503 while unset —
#                          deliberately no fail-fast guard here, unlike JWT_SECRET/etc, since
#                          billing isn't live yet and this must not crash the whole deploy.
#   STRIPE_WEBHOOK_SECRET  Signing secret for the /api/billing/webhook endpoint.
#   STRIPE_PRICE_ID_PRO    Stripe Price ID backing the "pro" plan in
#                          assessment-api/src/config/plans.js.
#   BILLING_SUCCESS_URL / BILLING_CANCEL_URL   Where Stripe Checkout redirects back to
#                          (defaults to a localhost dev URL — set these to the real frontend
#                          origin, e.g. https://coding.fortifyhub.net/admin/billing, before
#                          billing ever goes live).
#
# Health endpoints confirmed from source:
#   assessment-api  → GET /api/health          (returns 200 or 503)
#   assessment-api  → GET /api/health/ready     (lightweight, always 200 when up)
#   judge-service-go → GET /health              (returns {"status":"healthy"})
#
# Phase D live interview rooms (all optional):
#   coturn (now in docker-compose.turn.yml, NOT deployed by this file) is a self-hosted TURN relay for the WebRTC mesh in
#   frontend/src/components/InterviewRoom.jsx. It's optional in the sense that the room
#   still works without it via STUN alone on most networks — TURN only matters for
#   participants behind restrictive corporate/campus NATs. If you deploy it, the frontend
#   also needs VITE_TURN_URL/VITE_TURN_USERNAME/VITE_TURN_CREDENTIAL set to the SAME values
#   below at FRONTEND BUILD time (Vite inlines VITE_* vars at build, not runtime — this
#   compose file is backend-only, so that's wherever the frontend's own build/deploy step
#   lives). TURN_STATIC_SECRET here is a plain long-term shared username/password (not
#   coturn's time-limited HMAC REST credential mechanism) — a deliberately simpler
#   tradeoff given interview rooms are short-lived and already gated by a JWT or Phase C's
#   signed slot link before anyone reaches this page; revisit if TURN credentials ever leak
#   or get reused outside this app.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-assessment_db}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Internal only — no ports exposed
    networks:
      assessment-net:
        # Unique on this stack's own network. Services that also sit on Dokploy's shared network
        # (the API, because it has a domain) must use this, not the bare service name, which other
        # projects can answer instead. See docs/OPERATIONS_RUNBOOK.md (shared-network names).
        aliases:
          - go-judge-mongo

  # ── 2. Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASS:?REDIS_PASS is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Internal only — no ports exposed
    networks:
      assessment-net:
        # Unique on this stack's own network. Services that also sit on Dokploy's shared network
        # (the API, because it has a domain) must use this, not the bare service name, which other
        # projects can answer instead. See docs/OPERATIONS_RUNBOOK.md (shared-network names).
        aliases:
          - go-judge-redis

  # ── 3. RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    # Management UI intentionally not exposed. Uncomment only for debugging:
    # ports:
    #   - "15672:15672"
    networks:
      assessment-net:
        # Unique on this stack's own network. Services that also sit on Dokploy's shared network
        # (the API, because it has a domain) must use this, not the bare service name, which other
        # projects can answer instead. See docs/OPERATIONS_RUNBOOK.md (shared-network names).
        aliases:
          - go-judge-rabbitmq

  # ── 4. Assessment API (Node.js) ───────────────────────────────────────────────
  # Health: GET /api/health (deep check) or GET /api/health/ready (lightweight)
  assessment-api:
    build:
      context: .
      dockerfile: assessment-api/Dockerfile
    restart: unless-stopped
    command: npm start    # runs: node src/server.js  (confirmed in package.json)
    # Host port is overridable because more than one stack is built from this same file
    # on the same host. Two of them cannot both publish 5000: the second to start fails
    # with "Bind for :::5000 failed: port is already allocated" and its assessment-api
    # never comes up, while every other service does — a half-broken deploy that still
    # looks healthy because the judge itself is fine on 8081.
    #
    # The default stays 5000 so existing deploys are completely unaffected. A second
    # stack sets API_HOST_PORT to something free (e.g. 5001) in its own Dokploy
    # environment. Traefik routes each domain to container port 5000 over the compose
    # network either way, so this only affects direct host access.
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://admin:${MONGO_ROOT_PASS}@go-judge-mongo:27017/${MONGO_DB_NAME:-assessment_db}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-assessment_db}
      REDIS_URI: redis://:${REDIS_PASS}@go-judge-redis:6379
      REDIS_PASS: ${REDIS_PASS:?REDIS_PASS is required}
      REDIS_HOST: go-judge-redis
      # Passed as separate fields (not a pre-built amqp:// URI) so passwords
      # with reserved URL characters (%, $, ^, @, ...) don't break URL parsing.
      RABBITMQ_USER: user
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RABBITMQ_HOST: go-judge-rabbitmq
      RABBITMQ_PORT: "5672"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TESTING_PLATFORM_KEY: ${TESTING_PLATFORM_KEY:?TESTING_PLATFORM_KEY is required}
      CODEASSESS_SHIM_KEY: ${CODEASSESS_SHIM_KEY:?CODEASSESS_SHIM_KEY is required}
      ARVENTIQ_SECRET: ${ARVENTIQ_SECRET:?ARVENTIQ_SECRET is required}
      JUDGE_SERVICE_URL: http://go-judge-engine:8081
      # Browser origins allowed to call the API with cookies (comma-separated). The web frontend at
      # assess.fortifyhub.net MUST be listed: browsers send an Origin header even on same-site POSTs,
      # and the API rejects any origin not listed here (shows up as a generic 500 on login).
      # Add more origins (custom college domains, other frontends) by setting CORS_ALLOWED_ORIGINS
      # in the Dokploy environment; set it to the FULL list, it replaces this default.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://assess.fortifyhub.net}
      # Settings the API reads that were never passed through, so setting them in Dokploy did nothing.
      # Empty means "use the API's built-in default" (see assessment-api/src/config/env.js).
      # Default per-client limits for API keys that have none of their own (0 = unlimited).
      API_CLIENT_DEFAULT_RATE_PER_MIN: ${API_CLIENT_DEFAULT_RATE_PER_MIN:-}
      API_CLIENT_DEFAULT_MONTHLY_QUOTA: ${API_CLIENT_DEFAULT_MONTHLY_QUOTA:-}
      # Public URL of the web frontend, used to build links in emails and interview invites.
      # Unset, it falls back to a localhost dev URL, so set it (e.g. https://assess.fortifyhub.net).
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Outgoing email (optional; email features stay off without SMTP_HOST).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # H5 per-college submission quota — optional, falls back to 30 per 60s (see env.js) if
      # unset. That default is a fairness guard sized for small/incidental multi-college
      # traffic, not a real exam cohort — measured too strict for ~500 students sharing one
      # college during a live exam (only 30 submissions/min *total* for the whole college).
      # Recommend COLLEGE_SUBMISSION_QUOTA=300 once judge capacity (pool autoscaling,
      # language mix — see judge-service-go's env vars above) has been sized for that
      # cohort; see docs/PLATFORM_AUDIT_AND_SAAS_ROADMAP.md capacity notes. This still isn't
      # the judge's own throughput ceiling — see STUDENT_SUBMISSION_QUOTA below for the
      # per-student companion that keeps the larger shared pool from being monopolized.
      COLLEGE_SUBMISSION_QUOTA: ${COLLEGE_SUBMISSION_QUOTA:-}
      COLLEGE_SUBMISSION_QUOTA_WINDOW_SECONDS: ${COLLEGE_SUBMISSION_QUOTA_WINDOW_SECONDS:-}
      # Per-student companion quota — optional, falls back to 10 per 60s (see env.js) if
      # unset. Caps how much of the college-wide pool above one student can consume, so a
      # runaway auto-submit loop (or one impatient student) can't starve the rest of the
      # cohort once the college-wide number is raised to something generous.
      STUDENT_SUBMISSION_QUOTA: ${STUDENT_SUBMISSION_QUOTA:-}
      STUDENT_SUBMISSION_QUOTA_WINDOW_SECONDS: ${STUDENT_SUBMISSION_QUOTA_WINDOW_SECONDS:-}
      # Phase 2 billing — all optional, see the comment block at the top of this file.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
    healthcheck:
      # Uses node (always available) instead of wget (not on node:20-alpine by default)
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTE: server.js calls initRabbit() synchronously at startup — if RabbitMQ
    # isn't ready, the process exits (process.exit(1)). The healthcheck + restart
    # policy handles recovery. If you want more resilience, add retry logic in rabbit.js.
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      assessment-net:
        # Name that exists ONLY on this stack's own network. The frontend proxies to this, not to
        # "assessment-api": on Dokploy that service name also exists on the network shared with every
        # other project, so it can resolve to another stack's container (or a dead address).
        aliases:
          - go-judge-api

  # ── 5. Docker Socket Proxy ────────────────────────────────────────────────────
  # The ONLY thing in this stack that touches the host's real docker.sock. Scopes
  # judge-service-go's Docker access down to just the endpoints it actually calls
  # (container create/start/stop/remove/inspect/update, exec create/start, image
  # inspect/pull — see judge-service-go/pkg/pool/pool.go and pkg/executor/executor.go)
  # instead of handing it the raw socket, which is full unscoped host/Docker-daemon
  # admin access. Everything else (networks, volumes, swarm, build, secrets, etc.)
  # is left at its default of disabled. See docs/CODESPACE_HANDOFF.md item #9 —
  # verified locally: pool warm-up, orphan cleanup, and real Python/Java submissions
  # (interpreted + compiled, i.e. exec + resource-update calls) all work through it,
  # while GET /networks and GET /volumes correctly 403.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CONTAINERS: "1"
      POST: "1"
      DELETE: "1"
      EXEC: "1"
      IMAGES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Internal only — never exposed publicly
    networks:
      - assessment-net

  # ── 6. Judge Service (Go) ─────────────────────────────────────────────────────
  # Health: GET /health → {"status":"healthy"}
  judge-service-go:
    # Runs as the Dockerfile's non-root "app" user. It no longer touches
    # docker.sock at all — it talks to the docker-socket-proxy service above over
    # the internal network (DOCKER_HOST below), which is the only thing holding
    # the real socket and only forwards the specific endpoints judge-service-go
    # needs. Do NOT add `user: root` back here or bind-mount docker.sock directly
    # — either would still let arbitrary code executed via an RCE in this service
    # reach the rest of the host/containers, just no longer through the Docker API
    # (see docs/PLATFORM_AUDIT_AND_SAAS_ROADMAP.md).
    build:
      context: ./judge-service-go
      dockerfile: Dockerfile    # multi-stage build → slim alpine runtime image
    restart: unless-stopped
    volumes:
      - /tmp:/tmp
    environment:
      # Passed as separate fields (not a pre-built amqp:// URL) so passwords
      # with reserved URL characters (%, $, ^, @, ...) don't break URL parsing.
      RABBITMQ_USER: user
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MONGO_URI: mongodb://admin:${MONGO_ROOT_PASS}@mongo:27017/${MONGO_DB_NAME:-assessment_db}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-assessment_db}
      REDIS_URI: redis://:${REDIS_PASS}@redis:6379
      REDIS_PASS: ${REDIS_PASS:?REDIS_PASS is required}
      HEALTH_PORT: "8081"
      LOG_LEVEL: ${JUDGE_LOG_LEVEL:-info}
      DEFAULT_POOL_SIZE: ${JUDGE_POOL_SIZE:-2}
      MAX_EXECUTIONS_PER_CONTAINER: ${JUDGE_MAX_EXECS:-500}
      # Per-language pool sizing / autoscaling — see the header comment above for the full
      # list of additional per-language and threshold/cooldown vars available but not wired
      # here by default (their Go-side defaults apply unless set directly in Dokploy env).
      JUDGE_POOL_MAX_JAVA: ${JUDGE_POOL_MAX_JAVA:-8}
      JUDGE_POOL_MAX_CPP: ${JUDGE_POOL_MAX_CPP:-8}
      JUDGE_POOL_GLOBAL_CAP: ${JUDGE_POOL_GLOBAL_CAP:-60}
      JUDGE_POOL_AUTOSCALE_ENABLED: ${JUDGE_POOL_AUTOSCALE_ENABLED:-false}
      JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-24}
      # Every other judge setting is passed through as well. Only variables listed here reach the
      # container, so a setting added in Dokploy but missing here is silently ignored (this happened
      # to JUDGE_INTERACTIVE_WORKERS, JUDGE_POOL_MAX_PY and JUDGE_BATCH_THRESHOLD_*). An empty value
      # means "use the judge's built-in default", so listing them changes nothing until they are set.
      JUDGE_INTERACTIVE_WORKERS: ${JUDGE_INTERACTIVE_WORKERS:-}
      JUDGE_INTERACTIVE_RESERVE: ${JUDGE_INTERACTIVE_RESERVE:-}
      JUDGE_BATCH_THRESHOLD_PY: ${JUDGE_BATCH_THRESHOLD_PY:-}
      JUDGE_BATCH_THRESHOLD_JS: ${JUDGE_BATCH_THRESHOLD_JS:-}
      JUDGE_BATCH_THRESHOLD_JAVA: ${JUDGE_BATCH_THRESHOLD_JAVA:-}
      JUDGE_BATCH_THRESHOLD_CPP: ${JUDGE_BATCH_THRESHOLD_CPP:-}
      JUDGE_POOL_MAX_PY: ${JUDGE_POOL_MAX_PY:-}
      JUDGE_POOL_MAX_JS: ${JUDGE_POOL_MAX_JS:-}
      JUDGE_POOL_MAX_TS: ${JUDGE_POOL_MAX_TS:-}
      JUDGE_POOL_MAX_C: ${JUDGE_POOL_MAX_C:-}
      JUDGE_POOL_MAX_CS: ${JUDGE_POOL_MAX_CS:-}
      JUDGE_POOL_MAX_GO: ${JUDGE_POOL_MAX_GO:-}
      JUDGE_POOL_MAX_RS: ${JUDGE_POOL_MAX_RS:-}
      JUDGE_POOL_MAX_RB: ${JUDGE_POOL_MAX_RB:-}
      JUDGE_POOL_MAX_PHP: ${JUDGE_POOL_MAX_PHP:-}
      JUDGE_POOL_MAX_KT: ${JUDGE_POOL_MAX_KT:-}
      JUDGE_POOL_MIN_PY: ${JUDGE_POOL_MIN_PY:-}
      JUDGE_POOL_MIN_JS: ${JUDGE_POOL_MIN_JS:-}
      JUDGE_POOL_MIN_TS: ${JUDGE_POOL_MIN_TS:-}
      JUDGE_POOL_MIN_JAVA: ${JUDGE_POOL_MIN_JAVA:-}
      JUDGE_POOL_MIN_C: ${JUDGE_POOL_MIN_C:-}
      JUDGE_POOL_MIN_CPP: ${JUDGE_POOL_MIN_CPP:-}
      JUDGE_POOL_MIN_CS: ${JUDGE_POOL_MIN_CS:-}
      JUDGE_POOL_MIN_GO: ${JUDGE_POOL_MIN_GO:-}
      JUDGE_POOL_MIN_RS: ${JUDGE_POOL_MIN_RS:-}
      JUDGE_POOL_MIN_RB: ${JUDGE_POOL_MIN_RB:-}
      JUDGE_POOL_MIN_PHP: ${JUDGE_POOL_MIN_PHP:-}
      JUDGE_POOL_MIN_KT: ${JUDGE_POOL_MIN_KT:-}
      JUDGE_POOL_AUTOSCALE_INTERVAL: ${JUDGE_POOL_AUTOSCALE_INTERVAL:-}
      JUDGE_POOL_SCALE_UP_THRESHOLD_MS: ${JUDGE_POOL_SCALE_UP_THRESHOLD_MS:-}
      JUDGE_POOL_SCALE_DOWN_THRESHOLD_MS: ${JUDGE_POOL_SCALE_DOWN_THRESHOLD_MS:-}
      JUDGE_POOL_SCALE_UP_COOLDOWN: ${JUDGE_POOL_SCALE_UP_COOLDOWN:-}
      JUDGE_POOL_SCALE_DOWN_COOLDOWN: ${JUDGE_POOL_SCALE_DOWN_COOLDOWN:-}
      JUDGE_CENTRAL_COMPARE_PY: "true"
      JUDGE_CENTRAL_COMPARE_JS: "true"
      JUDGE_CENTRAL_COMPARE_JAVA: "true"
      JUDGE_CENTRAL_COMPARE_CPP: "true"
      JUDGE_CENTRAL_COMPARE_C: "true"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s    # pool warmup takes time — give it a minute
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    # Internal only — never exposed publicly
    deploy:
      resources:
        limits:
          memory: 2G    # Judge compiles/runs code — cap memory to protect the host
    networks:
      assessment-net:
        # Unique on this stack's own network. Services that also sit on Dokploy's shared network
        # (the API, because it has a domain) must use this, not the bare service name, which other
        # projects can answer instead. See docs/OPERATIONS_RUNBOOK.md (shared-network names).
        aliases:
          - go-judge-engine

  # ── 7. frontend (static SPA + nginx reverse proxy) ───────────────────────────
  # Serves the built React app and proxies /api and /ws/interview to assessment-api, so the
  # browser uses a single origin. Attach the public domain to THIS service on
  # container port 80 in Dokploy (Domains tab). It publishes no host port.
  # VITE_* values are baked in at build time; set them in the Dokploy environment BEFORE
  # building if you use TURN (see docker-compose.turn.yml). Leave unset otherwise.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_TURN_URL: ${VITE_TURN_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    environment:
      # host:port nginx proxies /api and /ws/interview to. Must be the alias above.
      API_UPSTREAM: ${API_UPSTREAM:-go-judge-api:5000}
    restart: unless-stopped
    depends_on:
      - assessment-api
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - assessment-net

  # ── 8. Judge Sandbox Language Environment Images ─────────────────────────────
  judge-java:
    build:
      context: ./judge-service-go/environments/java
      dockerfile: Dockerfile
    image: judge-java-env
    networks:
